<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votação de Atributos - Campeonato Puro Sangue</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #2c2c2c;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }
        h1, h2 {
            color: #e6b800; /* Dourado */
            text-align: center;
            border-bottom: 2px solid #555;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        /* --- ESTILO DOS INPUTS E SELECT --- */
        .input-control {
            margin-bottom: 20px;
        }
        .input-control label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #ccc;
        }
        .input-control select, .input-control input[type="text"], .input-control input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 4px;
            background-color: #444;
            color: white;
            font-size: 1em;
            box-sizing: border-box;
            appearance: none;
        }
        .atributo-grupo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background-color: #3a3a3a;
            border-radius: 4px;
        }
        .atributo-grupo label {
            font-weight: bold;
            flex-basis: 40%;
            color: #ccc;
        }
        .atributo-grupo input[type="number"] {
            flex-basis: 25%;
            padding: 8px;
            text-align: center;
            font-size: 1em;
        }
        /* --- ESTILO DA CARTA FUT --- */
        .card-preview {
            position: relative;
            margin: 20px auto;
            width: 250px; 
            height: 380px; 
            background-size: cover;
            background-position: center;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.7);
            color: #000; 
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            padding-bottom: 40px;  /* <---ALTURA DOS: PAC,SHO, PAS E ETC */
        }
        .card-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; 
            z-index: 1; 
        }
        .card-overall {
            position: absolute;
            top: 45px;  /* <--- N° MEDIA-SOB-DESCE */
            left: 20px;
            font-size: 3.5em; 
            font-weight: bold;
            color: #333; 
            z-index: 3;
            line-height: 1; 
        }
        .card-pos-text {
            position: absolute;
            top: 105px;  /* <--- POSIÇÃO-SOB-DESCE */
            left: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: #555; 
            z-index: 3;
        }
        /* [MODIFICADO] Bandeira Fixa */
        .card-flag {
            position: absolute;
            top: 140px;  /* <--- BANDEIRA-SOB-DESCE */
            left: 20px;
            width: 40px; 
            height: auto;
            border-radius: 3px;
            z-index: 3;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
        /* [MODIFICADO] Brasão Fixo */
        .card-club-logo {
            position: absolute;
            top: 180px; /* <--- BRASAO-SOB-DESCE */
            left: 20px;
            width: 50px; 
            height: 50px;
            object-fit: contain;
            z-index: 3;
        }
        .card-player-photo {
            position: absolute;
            top: 60px; 
            left: 50%;
            transform: translateX(-50%); 
            height: 215px;  /* <--- FOTO DO JOGADOR-SOB-DESCE */
            width: auto;
            object-fit: contain;
            z-index: 2; 
        }
        .card-name-text {
            position: relative; 
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-top: 10px; 
            z-index: 3;
            text-transform: uppercase;
        }
        .card-attributes-fut {
            display: flex;
            flex-wrap: wrap;
            justify-content: center; 
            margin-top: -5px;  /* <--- NOME DO JOGADOR-SOB-DESCE */
            z-index: 3;
            padding: 0 10px; 
        }
        .card-attribute-item-fut {
            width: 45%; 
            text-align: left;
            font-size: 1.1em;
            color: #333;
            padding: 4px 0;
            display: flex;
            align-items: center;
            justify-content: flex-start; 
        }
        .attr-value-fut {
            font-weight: bold;
            display: inline-block;
            width: 45px; 
            text-align: right;
            margin-right: 5px;
        }
        .attr-label-fut {
            font-size: 0.9em;
            font-weight: normal;
        }
        /* --- BOTÕES --- */
        .btn-acao {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-acao:hover {
            opacity: 0.9;
        }
        .btn-salvar {
            background-color: #28a745;
        }
        .btn-navegacao {
            background-color: #007bff;
        }
        .btn-perigo {
            background-color: #dc3545;
        }
        /* --- BOTÃO ADMIN --- */
        #btnAdmin {
            background: #444;
            color: #999;
            border: 1px solid #555;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            margin: 20px auto 0;
            display: block;
        }
        #btnAdmin:hover {
            background: #555;
            color: #fff;
        }
        /* --- PAINEL ADMIN MODAL --- */
        #adminPanel {
            display: none; 
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.8);
        }
        .admin-content {
            background-color: #2c2c2c;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            border-radius: 8px;
            width: 90%;
            max-width: 800px;
            color: white;
        }
        #historico-log {
            height: 400px;
            overflow-y: auto;
            background: #1a1a1a;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 20px;
        }
        .log-entry {
            border-bottom: 1px solid #444;
            padding: 8px 0;
            font-size: 0.9em;
        }
        .log-entry strong {
            color: #e6b800;
        }
    </style>
</head>
<body>

    <div id="telaObrigado" style="display: none; text-align: center;">
        <h1 style="color: #e6b800;">Obrigado pela Avaliação!</h1>
        <h2 style="color: #ccc; font-size: 1.2em;">Estes foram os seus votos:</h2>
        <div class="card-preview" id="card-resultado-voto"></div>
        <p style="color: #999; font-style: italic;">Seu voto foi salvo com sucesso.</p>
        <button id="btnVotarNovamente" class="btn-acao btn-navegacao">Votar Novamente</button>
    </div>

    <div id="adminPanel">
        <div class="admin-content">
            <h2>Painel de Administração</h2>
            <h3>Histórico de Votos</h3>
            <div id="historico-log"></div>
            <button id="btnAdminZerarTUDO" class="btn-acao btn-perigo">Zerar TODOS os Votos (Médias e Histórico)</button>
            <button id="btnFecharAdmin" class="btn-acao btn-navegacao" style="background-color: #555;">Fechar Painel</button>
        </div>
    </div>

    <div class="container" id="containerPrincipal">
        <h1>Votação de Atributos</h1>
        <h2 style="color: #ccc; font-size: 1.2em;">Escolha o jogador e avalie!</h2>

        <div class="input-control">
            <label for="selecao-jogador">Escolha o Jogador a ser Avaliado:</label>
            <select id="selecao-jogador" onchange="atualizarPreview()">
                <option value="" disabled selected>--- Selecione um jogador ---</option>
            </select>
        </div>

        <div class="card-preview" id="card-preview"></div>

        <form id="formularioVotacao">
            <h2>Notas (20 a 100)</h2>
            <div class="atributo-grupo"><label for="pac">PAC (Ritmo):</label><input type="number" id="pac" name="pac" min="20" max="100" value="50" required onchange="atualizarPreview()"></div>
            <div class="atributo-grupo"><label for="sho">SHO (Chute):</label><input type="number" id="sho" name="sho" min="20" max="100" value="50" required onchange="atualizarPreview()"></div>
            <div class="atributo-grupo"><label for="pas">PAS (Passe):</label><input type="number" id="pas" name="pas" min="20" max="100" value="50" required onchange="atualizarPreview()"></div>
            <div class="atributo-grupo"><label for="dri">DRI (Drible):</label><input type="number" id="dri" name="dri" min="20" max="100" value="50" required onchange="atualizarPreview()"></div>
            <div class="atributo-grupo"><label for="def">DEF (Defesa):</label><input type="number" id="def" name="def" min="20" max="100" value="50" required onchange="atualizarPreview()"></div>
            <div class="atributo-grupo"><label for="phy">PHY (Físico):</label><input type="number" id="phy" name="phy" min="20" max="100" value="50" required onchange="atualizarPreview()"></div>

            <hr style="border-color: #555; margin-top: 25px; margin-bottom: 20px;">
            
            <div class="input-control">
                <label for="nome-votante">Seu Nome:</label>
                <input type="text" id="nome-votante" placeholder="Seu nome completo" required>
            </div>
            <div class="input-control">
                <label for="apelido-votante">Seu Apelido:</label>
                <input type="text" id="apelido-votante" placeholder="Seu apelido no campeonato" required>
            </div>

            <button type="submit" class="btn-acao btn-salvar">Salvar Votação</button>
        </form>

        <button id="btnAdmin">Administração</button>
    </div>

    <script>
        const CHAVE_STORAGE_MEDIAS = 'votacoesPuroSangue_MEDIAS';
        const CHAVE_STORAGE_HISTORICO = 'votacoesPuroSangue_HISTORICO';

        // --- DADOS DOS JOGADORES (Simplificado: sem nacionalidade e clube) ---
        const JOGADORES_DATA = {
            'Gustavo': { pos: 'TEC', foto: 'assets/players/gustavo.png' },
            'Vinicios': { pos: 'AUX', foto: 'assets/players/vinicios.png' },
            'Luan': { pos: 'AUX', foto: 'assets/players/luan.png' },
            'Yoshi': { pos: 'DIR', foto: 'assets/players/yoshi.png' },
            'Lukas Pacini': { pos: 'GOL', foto: 'assets/players/lukas.png' },
            'Pedro': { pos: 'GOL', foto: 'assets/players/pedro.png' },
            'Valdir': { pos: 'Z.VL', foto: 'assets/players/valdir.png' },
            'Matheus': { pos: 'Z.VL', foto: 'assets/players/matheus.png' },
            'Hiago': { pos: 'Z.VL', foto: 'assets/players/hiago.png' },
            'Douglas': { pos: 'Z.VL', foto: 'assets/players/douglas.png' },
            'Edilson': { pos: 'L', foto: 'assets/players/edilson.png' },
            'Rafinha': { pos: 'L', foto: 'assets/players/rafinha.png' },
            'Edmar': { pos: 'L', foto: 'assets/players/edmar.png' },
            'Bruno': { pos: 'L', foto: 'assets/players/bruno.png' },
            'Thiago': { pos: 'L', foto: 'assets/players/thiago.png' },
            'Brendon Stork': { pos: 'MEI', foto: 'assets/players/brendon.png' },
            'Gabriel Storck': { pos: 'MEI', foto: 'assets/players/gabriel.png' },
            'Léo L10': { pos: 'MEI', foto: 'assets/players/leo.png' },
            'Bruno Henrrique': { pos: 'ATA', foto: 'assets/players/brunohenrrique.png' },
            'Juca': { pos: 'ATA', foto: 'assets/players/juca.png' }
        };
        
        // --- [MODIFICADO] Mapeamentos removidos ---
        // (Não precisamos mais de CLUBE_LOGOS ou NACIONALIDADE_BANDEIRAS)

// Função para obter o caminho da imagem de fundo do card
        function getCardBackground(overall) {
            // Conforme solicitado, a página de votação usa sempre o card base 50.png
            return 'assets/card_backgrounds/50.png';
        }

        // [MODIFICADO] Função para gerar o HTML da carta (com imagens fixas)
        function gerarCardHTML(overall, pos, nomeJogador, fotoJogador, pac, sho, pas, dri, def, phy) {
            const cardBg = getCardBackground(overall);
            
            // [FIXO] Caminhos diretos para as imagens do campeonato
            const flagSrc = 'assets/bandeira_campeonato.png';
            const clubLogoSrc = 'assets/brasao_campeonato.png';

            return `
                <img src="${cardBg}" alt="Card Background" class="card-background">
                <span class="card-overall">${overall || '??'}</span>
                <span class="card-pos-text">${pos || 'POS'}</span>
                <img src="${flagSrc}" alt="Bandeira do Campeonato" class="card-flag">
                <img src="${clubLogoSrc}" alt="Brasão do Campeonato" class="card-club-logo">
                <img src="${fotoJogador || 'https://via.placeholder.com/150/000080/FFFFFF?text=JOGADOR'}" alt="${nomeJogador || ''}" class="card-player-photo">
                <div class="card-name-text">${nomeJogador || 'Selecione um jogador'}</div>
                <div class="card-attributes-fut">
                    <div class="card-attribute-item-fut"><span class="attr-value-fut">${pac || '??'}</span> <span class="attr-label-fut">PAC</span></div>
                    <div class="card-attribute-item-fut"><span class="attr-value-fut">${dri || '??'}</span> <span class="attr-label-fut">DRI</span></div>
                    <div class="card-attribute-item-fut"><span class="attr-value-fut">${sho || '??'}</span> <span class="attr-label-fut">SHO</span></div>
                    <div class="card-attribute-item-fut"><span class="attr-value-fut">${def || '??'}</span> <span class="attr-label-fut">DEF</span></div>
                    <div class="card-attribute-item-fut"><span class="attr-value-fut">${pas || '??'}</span> <span class="attr-label-fut">PAS</span></div>
                    <div class="card-attribute-item-fut"><span class="attr-value-fut">${phy || '??'}</span> <span class="attr-label-fut">PHY</span></div>
                </div>
            `;
        }


        // Função para popular o dropdown
        function popularJogadores() {
            const select = document.getElementById('selecao-jogador');
            for (const nome in JOGADORES_DATA) {
                const option = document.createElement('option');
                option.value = nome;
                option.textContent = nome;
                select.appendChild(option);
            }
        }

        // [MODIFICADO] Função para atualizar a pré-visualização da carta
        function atualizarPreview() {
            const nomeSelecionado = document.getElementById('selecao-jogador').value;
            const dadosJogador = JOGADORES_DATA[nomeSelecionado];
            const cardPreview = document.getElementById('card-preview');

            if (!dadosJogador) {
                cardPreview.innerHTML = gerarCardHTML(null, null, null, null, null, null, null, null, null, null);
                return;
            }

            const pac = parseInt(document.getElementById('pac').value) || 0;
            const sho = parseInt(document.getElementById('sho').value) || 0;
            const pas = parseInt(document.getElementById('pas').value) || 0;
            const dri = parseInt(document.getElementById('dri').value) || 0;
            const def = parseInt(document.getElementById('def').value) || 0;
            const phy = parseInt(document.getElementById('phy').value) || 0;

            const atributos = [pac, sho, pas, dri, def, phy];
            const somaAtributos = atributos.reduce((a, b) => a + b, 0);
            const overall = atributos.filter(v => v > 0).length > 0 ? Math.round(somaAtributos / atributos.filter(v => v > 0).length) : 0;
            
            cardPreview.innerHTML = gerarCardHTML(
                overall,
                dadosJogador.pos,
                nomeSelecionado,
                dadosJogador.foto,
                pac, sho, pas, dri, def, phy
            );
        }

        // Inicializa a lista de jogadores e a pré-visualização
        document.addEventListener('DOMContentLoaded', () => {
            popularJogadores();
            atualizarPreview();
        });

        // Ação ao ENVIAR O FORMULÁRIO
        document.getElementById('formularioVotacao').addEventListener('submit', function(event) {
            event.preventDefault(); 
            
            const nomeSelecionado = document.getElementById('selecao-jogador').value;
            const nomeVotante = document.getElementById('nome-votante').value.trim();
            const apelidoVotante = document.getElementById('apelido-votante').value.trim();

            if (!nomeSelecionado) {
                alert('Por favor, selecione o jogador que você está avaliando.');
                return;
            }
            if (nomeVotante === "" || apelidoVotante === "") {
                alert("Por favor, preencha seu Nome e Apelido para registrar o voto.");
                return;
            }
            
            const inputs = document.querySelectorAll('#formularioVotacao input[type="number"]');
            let valido = true;
            inputs.forEach(input => {
                const valor = parseInt(input.value);
                if (isNaN(valor) || valor < 20 || valor > 100) {
                    valido = false;
                }
            });

            if (!valido) {
                 alert('Por favor, insira valores entre 20 e 100 em todos os atributos.');
                 return;
            }

            const dadosJogador = JOGADORES_DATA[nomeSelecionado];
            const pac = parseInt(document.getElementById('pac').value);
            const sho = parseInt(document.getElementById('sho').value);
            const pas = parseInt(document.getElementById('pas').value);
            const dri = parseInt(document.getElementById('dri').value);
            const def = parseInt(document.getElementById('def').value);
            const phy = parseInt(document.getElementById('phy').value);
            
            const atributos = [pac, sho, pas, dri, def, phy];
            const somaAtributos = atributos.reduce((a, b) => a + b, 0);
            const overall = Math.round(somaAtributos / atributos.length);
            const votoAtual = { pac, sho, pas, dri, def, phy };

            // 1. Salvar para as Médias
            salvarVotoParaMedia(nomeSelecionado, dadosJogador, votoAtual);

            // 2. Salvar no Histórico
            salvarVotoNoHistorico(nomeVotante, apelidoVotante, nomeSelecionado, votoAtual, overall);

            // 3. Mostrar Tela de Obrigado
            mostrarTelaObrigado(nomeSelecionado, dadosJogador, votoAtual, overall);
        });

        // (Modificada) Salva o voto para a página de MÉDIAS
        function salvarVotoParaMedia(nomeJogador, dadosBase, novosVotos) {
            let votacoes = JSON.parse(localStorage.getItem(CHAVE_STORAGE_MEDIAS)) || {};
            if (!votacoes[nomeJogador]) {
                votacoes[nomeJogador] = {
                    totalVotos: 0,
                    somaNotas: { pac: 0, sho: 0, pas: 0, dri: 0, def: 0, phy: 0 },
                    dadosBase: dadosBase // Salva a foto e pos
                };
            }
            const dados = votacoes[nomeJogador];
            dados.totalVotos++;
            dados.somaNotas.pac += novosVotos.pac;
            dados.somaNotas.sho += novosVotos.sho;
            dados.somaNotas.pas += novosVotos.pas;
            dados.somaNotas.dri += novosVotos.dri;
            dados.somaNotas.def += novosVotos.def;
            dados.somaNotas.phy += novosVotos.phy;
            localStorage.setItem(CHAVE_STORAGE_MEDIAS, JSON.stringify(votacoes));
        }

        // Salva o voto individual no HISTÓRICO
        function salvarVotoNoHistorico(nomeVotante, apelidoVotante, nomeJogador, notas, overall) {
            let historico = JSON.parse(localStorage.getItem(CHAVE_STORAGE_HISTORICO)) || [];
            
            const novoRegistro = {
                votante: `${nomeVotante} (${apelidoVotante})`,
                jogador: nomeJogador,
                overall: overall,
                notas: notas,
                data: new Date().toLocaleString("pt-BR")
            };

            historico.push(novoRegistro);
            localStorage.setItem(CHAVE_STORAGE_HISTORICO, JSON.stringify(historico));
        }

        // [MODIFICADO] Mostra a tela de "Obrigado"
        function mostrarTelaObrigado(nomeJogador, dadosJogador, notas, overall) {
            const cardResultadoVoto = document.getElementById('card-resultado-voto');
            cardResultadoVoto.innerHTML = gerarCardHTML(
                overall,
                dadosJogador.pos,
                nomeJogador,
                dadosJogador.foto,
                notas.pac, notas.sho, notas.pas, notas.dri, notas.def, notas.phy
            );

            document.getElementById('containerPrincipal').style.display = 'none';
            document.getElementById('telaObrigado').style.display = 'block';
        }

        // Ação do botão "Votar Novamente"
        document.getElementById('btnVotarNovamente').addEventListener('click', function() {
            document.getElementById('telaObrigado').style.display = 'none';
            document.getElementById('containerPrincipal').style.display = 'block';

            document.getElementById('formularioVotacao').reset();
            document.getElementById('nome-votante').value = '';
            document.getElementById('apelido-votante').value = '';
            document.getElementById('selecao-jogador').selectedIndex = 0;
            atualizarPreview();
        });

        // --- LÓGICA DO PAINEL ADMIN (Sem mudança) ---
        document.getElementById('btnAdmin').addEventListener('click', function() {
            const login = prompt("Login (Admin):");
            if (login === null) return;
            const senha = prompt("Senha (Admin):");
            if (senha === null) return;

            if (login === "figurinha" && senha === "f12345") {
                abrirAdminPanel();
            } else {
                alert("Login ou senha incorretos.");
            }
        });

        function abrirAdminPanel() {
            document.getElementById('containerPrincipal').style.display = 'none';
            document.getElementById('telaObrigado').style.display = 'none';
            popularHistoricoVotos();
            document.getElementById('adminPanel').style.display = 'block';
        }

        function fecharAdminPanel() {
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('containerPrincipal').style.display = 'block';
            document.getElementById('formularioVotacao').reset();
            document.getElementById('nome-votante').value = '';
            document.getElementById('apelido-votante').value = '';
            document.getElementById('selecao-jogador').selectedIndex = 0;
            atualizarPreview();
        }
        document.getElementById('btnFecharAdmin').addEventListener('click', fecharAdminPanel);

        function popularHistoricoVotos() {
            const logContainer = document.getElementById('historico-log');
            logContainer.innerHTML = '';
            const historico = JSON.parse(localStorage.getItem(CHAVE_STORAGE_HISTORICO)) || [];

            if (historico.length === 0) {
                logContainer.innerHTML = '<p>Nenhum voto registrado no histórico.</p>';
                return;
            }

            historico.slice().reverse().forEach(voto => {
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.innerHTML = `
                    <strong>Votante:</strong> ${voto.votante} | <strong>Data:</strong> ${voto.data} <br>
                    <strong>Jogador:</strong> ${voto.jogador} (Overall: ${voto.overall}) <br>
                    <strong>Notas:</strong> 
                    PAC: ${voto.notas.pac}, 
                    SHO: ${voto.notas.sho}, 
                    PAS: ${voto.notas.pas}, 
                    DRI: ${voto.notas.dri}, 
                    DEF: ${voto.notas.def}, 
                    PHY: ${voto.notas.phy}
                `;
                logContainer.appendChild(entry);
            });
        }

        document.getElementById('btnAdminZerarTUDO').addEventListener('click', function() {
            const certeza = confirm("TEM CERTEZA?\n\nIsso vai apagar PERMANENTEMENTE todo o HISTÓRICO de votos e todas as MÉDIAS salvas.");
            if (certeza) {
                localStorage.removeItem(CHAVE_STORAGE_MEDIAS);
                localStorage.removeItem(CHAVE_STORAGE_HISTORICO);
                alert("Todos os dados de votação foram zerados!");
                popularHistoricoVotos();
            }
        });
        
    </script>

</body>
</html>
